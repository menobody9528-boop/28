<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    .code { font-size: 6rem; font-weight: bold; color: #888; }
    .msg { font-size: 1.2rem; color: #aaa; margin: 1rem 0 2rem; }
    a { color: #66f; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="msg">页面不存在</div>
  </div>
</body>
</html>
