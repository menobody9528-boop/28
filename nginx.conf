# Nginx 配置 - 南宫集团网站（防攻击版）
# 保存到: /etc/nginx/sites-available/ngdh

# === 限流配置 ===
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

# 连接数限制
limit_conn_zone $binary_remote_addr zone=addr:10m;

# === 请求大小限制 ===
client_body_buffer_size 16k;
client_header_buffer_size 1k;
client_max_body_size 8m;
large_client_header_buffers 4 8k;

# === 超时配置 ===
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 10s;

server {
    # 监听端口
    listen 80;
    listen [::]:80;

    # 替换为你的域名
    server_name your-domain.com www.your-domain.com;

    # 网站根目录
    root /var/www/ngdh;
    index index.html;

    # 访问日志
    access_log /var/log/nginx/ngdh_access.log;
    error_log /var/log/nginx/ngdh_error.log;

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === IP 访问限制 ===
    # 封禁恶意IP（可手动添加）
    # deny 1.2.3.4;

    # 允许CDN回源（Cloudflare等）
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # real_ip_header X-Forwarded-For;

    # === 限流规则 ===
    # 通用请求限流：每秒10个请求
    limit_req zone=general burst=20 nodelay;

    # 连接数限制：同一IP最多50个并发连接
    limit_conn addr 50;

    # === Gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss 
               application/json image/svg+xml application/font-woff2;

    # === 静态资源缓存 (CDN Friendly) ===
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-CDN-Status "HIT" always;
        limit_req zone=general burst=50 nodelay;
    }

    # === CDN 回源请求头 ===
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # JS/CSS 缓存
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # === 禁止访问 ===
    # 隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~* /\.(git|env|htaccess|htpasswd|DS_Store) {
        deny all;
    }

    # 禁止访问配置目录
    location ~ /(config|includes|logs|tmp)/ {
        deny all;
    }

    # === SPA 重写规则 ===
    try_files $uri $uri/ /index.html;

    # === 恶意请求拦截 ===
    # 防止SQL注入
    if ($query_string ~ "union.*select.*\(") {
        return 403;
    }
    if ($query_string ~ "union.*all.*select") {
        return 403;
    }
    if ($query_string ~ "concat.*\(") {
        return 403;
    }

    # 防止XSS
    if ($query_string ~ "<.*>") {
        return 403;
    }
    if ($query_string ~ "javascript:") {
        return 403;
    }

    # 防止路径遍历
    if ($query_string ~ "\.\.") {
        return 403;
    }
}

# === 暴力破解防护（可选）===
# 使用 fail2ban 配合 Nginx 日志
# 安装: sudo apt install fail2ban
# 配置 /etc/fail2ban/jail.local:
# [nginx-http-auth]
# enabled = true
# filter = nginx-http-auth
# port = http,https
# logpath = /var/log/nginx/ngdh_error.log
# bantime = 3600
# maxretry = 5

# === DDoS 缓解建议 ===
# 1. 使用 CDN（Cloudflare）
# 2. 启用硬件防火墙
# 3. 监控异常流量
# 4. 设置告警阈值